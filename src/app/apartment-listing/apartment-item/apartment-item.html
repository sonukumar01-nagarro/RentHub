<p-card class="max-w-[25rem] min-w-[15rem] h-full apartment-item-card">
  <ng-template #header>
    <img alt="Card" class="w-full h-[15rem] object-cover rounded-t-xl"
      [src]="apartment()?.image" />
  </ng-template>
  <ng-template #title> {{ apartment()?.title }} </ng-template>
  <ng-template #subtitle>
    <p class="text-lg font-bold">{{ apartment()?.rent | currency: 'INR' }}</p>
  </ng-template>
  <p class="text-sm font-semibold">
    <em class="pi pi-map-marker"></em>
    {{ apartment()?.location }}
  </p>
  <p class="my-2">
    {{ apartment()?.description }}
  </p>
  <ng-template #footer>
    <div class="flex flx-wrap gap-4 mt-1 justify-between">
      <p-button icon="pi {{ isFavorite() ? 'pi-heart-fill' : 'pi-heart'}}" class="favorite-btn"
        severity="secondary" text="true" [outlined]="true" (onClick)="toggleFavorite()" />
      <p-button label="View Details" class="w-full" styleClass="w-full" (click)="onDetailsClick()" />
    </div>
  </ng-template>
</p-card>
